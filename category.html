<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">செய்திகள் — TN வைரல் மீடியா</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@500;600;700;800&family=Catamaran:wght@400;500;600;700&family=Anek+Tamil:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B1220; --card:#16213A; --line:#28324A;
    --paper:#E9EDF2; --paper-dim:#9AA7BD;
    --ticker:#D62828; --gold:#E8A93A; --gold-soft:#F2C773; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--ink); color:var(--paper); font-family:'Catamaran', sans-serif; line-height:1.5;}
  h1,h2,.brand{font-family:'Baloo Thambi 2', 'Catamaran', sans-serif;}
  .meta,.tag,.chip{font-family:'Anek Tamil','Catamaran',sans-serif;}
  a{color:inherit;text-decoration:none;}
  img{display:block;max-width:100%;}

  .topbar{position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px; padding:14px 16px; background:rgba(11,18,32,0.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);}
  .back-btn{width:38px;height:38px;border-radius:10px;background:var(--card); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--paper); flex:0 0 auto;}
  .brand{font-size:18px; font-weight:700;}
  .brand .dot{color:var(--gold);}

  .chip-row{display:flex; gap:8px; overflow-x:auto; padding:14px 16px; scrollbar-width:none;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto; padding:8px 16px; border-radius:999px; background:var(--card); border:1px solid var(--line); font-size:13.5px; font-weight:600; color:var(--paper-dim); white-space:nowrap;}
  .chip.active{background:var(--gold); color:#221604; border-color:var(--gold);}

  main{padding:4px 16px 40px;}
  h1.pagehead{font-size:20px; margin:18px 0 14px; display:flex; align-items:center; gap:8px;}
  h1.pagehead::before{content:""; width:5px; height:20px; border-radius:3px; background:var(--gold); display:inline-block;}

  .news-grid{display:flex; flex-direction:column; gap:14px;}
  .news-card{display:flex; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:12px; align-items:center;}
  .thumb{flex:0 0 88px; width:88px; height:88px; border-radius:10px; background:linear-gradient(145deg, #24314F, #14203A); overflow:hidden;}
  .thumb img{width:100%; height:100%; object-fit:cover;}
  .news-body{flex:1; min-width:0;}
  .tag{display:inline-block; padding:4px 10px; border-radius:6px; background:var(--ticker); color:#fff; font-size:11.5px; font-weight:700; margin-bottom:6px;}
  .news-body h3{font-size:15.5px; margin:0 0 6px; font-weight:600; line-height:1.4;}
  .meta{font-size:12.5px; color:var(--paper-dim);}
  .state-msg{color:var(--paper-dim); font-size:13.5px; padding:24px; text-align:center; background:var(--card); border:1px dashed var(--line); border-radius:var(--radius);}
</style>
</head>
<body>

  <header class="topbar">
    <a class="back-btn" href="index.html" aria-label="பின் செல்ல">←</a>
    <div class="brand">TN <span class="dot">•</span> வைரல் மீடியா</div>
  </header>

  <nav class="chip-row" id="chipRow" aria-label="பிரிவுகள்">
    <a class="chip" href="category.html">அனைத்தும்</a>
    <a class="chip" href="category.html?cat=தமிழ்நாடு">தமிழ்நாடு</a>
    <a class="chip" href="category.html?cat=திண்டிவனம்">திண்டிவனம்</a>
    <a class="chip" href="category.html?cat=கடலூர்">கடலூர்</a>
    <a class="chip" href="category.html?cat=விழுப்புரம்">விழுப்புரம்</a>
    <a class="chip" href="category.html?cat=அரசியல்">அரசியல்</a>
    <a class="chip" href="category.html?cat=சினிமா">சினிமா</a>
    <a class="chip" href="category.html?cat=விளையாட்டு">விளையாட்டு</a>
    <a class="chip" href="category.html?cat=வீடியோ">வீடியோ</a>
  </nav>

  <main>
    <h1 class="pagehead" id="pageHead">செய்திகள்</h1>
    <div class="news-grid" id="newsGrid">
      <div class="state-msg">செய்திகள் ஏற்றப்படுகிறது…</div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="shared.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const cat = params.get('cat');

    if(cat){
      document.getElementById('pageHead').textContent = cat + ' — செய்திகள்';
      document.getElementById('pageTitle').textContent = cat + ' செய்திகள் — TN வைரல் மீடியா';
      document.querySelectorAll('#chipRow .chip').forEach(c=>{
        if(c.href.includes('cat=' + encodeURIComponent(cat))) c.classList.add('active');
      });
    }else{
      document.querySelector('#chipRow .chip').classList.add('active');
    }

    function renderList(items){
      const grid = document.getElementById('newsGrid');
      if(!items.length){
        grid.innerHTML = '<div class="state-msg">இந்த பிரிவில் இன்னும் செய்திகள் இல்லை</div>';
        return;
      }
      grid.innerHTML = items.map(i => `
        <a class="news-card" href="${i.link || '#'}" target="_blank" rel="noopener">
          <div class="thumb">${i.imageUrl ? `<img src="${i.imageUrl}" alt="">` : ''}</div>
          <div class="news-body">
            <span class="tag" style="background:${tagColor(i.category)};">${escapeHtml(i.category || 'செய்தி')}</span>
            <h3>${escapeHtml(i.title)}</h3>
            <div class="meta">${relTime(i.date)}</div>
          </div>
        </a>`).join('');
    }

    async function boot(){
      const [firestoreItems, rssItems] = await Promise.all([
        fetchFirestoreNews(),
        fetchPlaylistVideos()
      ]);
      let all = firestoreItems.concat(rssItems).sort((a,b)=> b.date - a.date);
      if(cat) all = all.filter(i => i.category === cat);
      renderList(all);
    }
    boot();
  </script>
</body>
</html>
